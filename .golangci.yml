# Gomanize - golangci-lint configuration (v2)
# https://golangci-lint.run/docs/configuration/

version: "2"

run:
  timeout: 5m
  go: '1.21'

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - unparam
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - unparam
          - staticcheck
      - path: hindi-orig\.go
        linters:
          - errcheck
          - unparam
          - ineffassign
          - staticcheck
  settings:
    misspell:
      locale: US

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/budhash/gomanize

output:
  formats:
    text:
      path: stdout
