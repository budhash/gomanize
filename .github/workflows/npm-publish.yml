name: Publish npm package

# Publishes @budhash/gomanize on a version tag. Inert until the NPM_TOKEN secret
# is set (it builds + smoke-tests, then skips publish), so it never breaks a
# release. One-time setup: create the npm @budhash scope and add an automation
# token as the NPM_TOKEN repo secret.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build, test, publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Build + smoke-test the package
        run: make npm-test

      - name: Check for npm token
        id: tok
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN not set — skipping publish (build + test still ran)."
          fi

      - name: Publish to npm
        if: steps.tok.outputs.have == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # align the package version with the tag (strip leading "v")
          npm --prefix npm version "${TAG#v}" --no-git-tag-version --allow-same-version
          npm --prefix npm publish --access public
