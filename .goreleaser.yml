# GoReleaser configuration
# https://goreleaser.com/customization/
version: 2

project_name: gomanize

before:
  hooks:
    - go mod tidy

builds:
  - id: gomanize
    main: ./cmd/gomanize
    binary: gomanize
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Tag}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: 'checksums.txt'

# Homebrew formula, pushed to the shared personal tap on each release.
# Users install with:  brew install budhash/tools/gomanize
# (or:  brew tap budhash/tools && brew install gomanize)
#
# Requires a HOMEBREW_TAP_TOKEN secret (a PAT with contents:write on
# budhash/homebrew-tools) — see the "Homebrew" section in README.md. Without it
# the release still succeeds for binaries/npm; only the formula push fails, so
# create the tap repo + token before the first tagged release that includes this.
brews:
  - name: gomanize
    repository:
      owner: budhash
      name: homebrew-tools
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/budhash/gomanize"
    description: "Romanize Devanagari (Hindi) into readable Latin script"
    license: "MIT"
    commit_author:
      name: budhash
      email: budhash@gmail.com
    install: |
      bin.install "gomanize"
    test: |
      assert_match "namaste", shell_output("#{bin}/gomanize नमस्ते")

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999

release:
  github:
    owner: budhash
    name: gomanize
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
